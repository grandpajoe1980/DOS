    SafetyShareCreate:
      type: object
      additionalProperties: false
      description: >-
        Adult-only; dependent/minor activation is denied. Recipients must be
        authorized for the same occurrence. Expiry must be future relative to
        server time and no later than the server maximum duration of 43,200
        seconds after receipt.
      x-authorization-policy:
        authenticated_adult_profile_only: true
        dependent_or_minor_denied: true
        recipient_scope: active_authorized_participant_in_same_occurrence
      x-expiry-policy:
        future_relative_to: server_received_at
        maximum_duration_seconds: 43200
        expiration_authority: server
      required: [occurrence_id, site_id, recipient_ids, expires_at, purpose]
      properties:
        occurrence_id: {$ref: "#/components/schemas/UUID"}
        site_id: {$ref: "#/components/schemas/UUID"}
        recipient_ids:
          description: Active authorized recipients in this same occurrence.
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: {$ref: "#/components/schemas/UUID"}
        expires_at:
          allOf:
            - {$ref: "#/components/schemas/Timestamp"}
          description: >-
            Future server time, at most 43,200 seconds after the server receives
            the request; client clocks are not authoritative.
        purpose: {type: string, minLength: 1, maxLength: 240}
    SafetyShare:
      type: object
      additionalProperties: false
      required:
        [id, organization_id, occurrence_id, site_id, recipient_ids,
         started_at, expires_at, state, version]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        organization_id: {$ref: "#/components/schemas/UUID"}
        occurrence_id: {$ref: "#/components/schemas/UUID"}
        site_id: {$ref: "#/components/schemas/UUID"}
        recipient_ids:
          type: array
          items: {$ref: "#/components/schemas/UUID"}
        started_at: {$ref: "#/components/schemas/Timestamp"}
        expires_at: {$ref: "#/components/schemas/Timestamp"}
        stopped_at:
          oneOf:
            - {$ref: "#/components/schemas/Timestamp"}
            - {type: "null"}
        state: {type: string, enum: [active, stopped, expired]}
        version: {$ref: "#/components/schemas/Version"}
    SafetyLocationSample:
      type: object
      additionalProperties: false
      required: [latitude, longitude, horizontal_accuracy_meters, captured_at]
      properties:
        latitude: {type: number, minimum: -90, maximum: 90}
        longitude: {type: number, minimum: -180, maximum: 180}
        horizontal_accuracy_meters: {type: number, minimum: 0, maximum: 10000}
