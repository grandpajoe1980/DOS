        expires_at: {$ref: "#/components/schemas/Timestamp"}
        latest_sample: {$ref: "#/components/schemas/SafetyLocationSample"}
    MediaUploadRequest:
      type: object
      additionalProperties: false
      required:
        [occurrence_id, content_type, byte_count, checksum_sha256, caption,
         participant_visibility_attested]
      properties:
        occurrence_id: {$ref: "#/components/schemas/UUID"}
        site_id:
          oneOf:
            - {$ref: "#/components/schemas/UUID"}
            - {type: "null"}
        content_type: {type: string, enum: [image/jpeg, image/png, image/heic]}
        byte_count: {type: integer, minimum: 1, maximum: 26214400}
        checksum_sha256: {type: string, pattern: "^[a-f0-9]{64}$"}
        caption: {type: string, maxLength: 1000}
        participant_visibility_attested: {type: boolean, const: true}
    MediaUploadAuthorization:
      type: object
      additionalProperties: false
      required: [media_id, upload_url, required_headers, expires_at]
      properties:
        media_id: {$ref: "#/components/schemas/UUID"}
        upload_url: {type: string, format: uri}
        required_headers:
          type: object
          additionalProperties: {type: string}
        expires_at: {$ref: "#/components/schemas/Timestamp"}
