      type: object
      additionalProperties: false
      required: [checksum_sha256, byte_count]
      properties:
        checksum_sha256: {type: string, pattern: "^[a-f0-9]{64}$"}
        byte_count: {type: integer, minimum: 1, maximum: 26214400}
    MediaProcessingState:
      type: string
      enum: [awaiting_upload, uploaded_private, scanning, processing, ready, rejected]
    MediaEventFeedState:
      type: string
      enum: [hidden_pending_processing, visible, quarantined, removed]
    MediaPublicGalleryState:
      type: string
      enum: [not_submitted, pending_review, approved, published, rejected, unpublished, removed]
    MediaAsset:
      type: object
      additionalProperties: false
      required:
        [id, organization_id, occurrence_id, site_id, caption,
         processing_state, event_feed_state, public_gallery_state,
         created_at, processed_at, version]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        organization_id: {$ref: "#/components/schemas/UUID"}
        occurrence_id: {$ref: "#/components/schemas/UUID"}
        site_id:
          oneOf:
            - {$ref: "#/components/schemas/UUID"}
            - {type: "null"}
        caption: {type: string, maxLength: 1000}
        processing_state: {$ref: "#/components/schemas/MediaProcessingState"}
        event_feed_state: {$ref: "#/components/schemas/MediaEventFeedState"}
        public_gallery_state: {$ref: "#/components/schemas/MediaPublicGalleryState"}
        created_at: {$ref: "#/components/schemas/Timestamp"}
        processed_at:
          oneOf:
            - {$ref: "#/components/schemas/Timestamp"}
            - {type: "null"}
        version: {$ref: "#/components/schemas/Version"}
      allOf:
        - if:
            required: [processing_state]
            properties: {processing_state: {const: ready}}
          then:
            properties:
              event_feed_state: {enum: [visible, quarantined, removed]}
        - if:
            required: [event_feed_state]
            properties: {event_feed_state: {const: visible}}
          then:
            properties:
              processing_state: {const: ready}
        - if:
            required: [public_gallery_state]
            properties: {public_gallery_state: {const: published}}
          then:
            properties:
              processing_state: {const: ready}
              event_feed_state: {const: visible}
    MediaFeedItem:
      type: object
      additionalProperties: false
      required: [id, occurrence_id, caption, uploader_display_name, created_at]
      properties:
